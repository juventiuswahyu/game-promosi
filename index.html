<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Business Simulator</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .game-container {
      background-color: #1e293b;
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      background-color: #0f172a;
      padding: 12px 20px;
      border-radius: 12px;
    }
    .stat-item {
      font-size: 14px;
      font-weight: bold;
    }
    .stat-val {
      color: #38bdf8;
    }
    .story-box {
      background-color: #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 50px;
      height: 50px;
      background-color: #6366f1;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .mentor-name {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .story-text {
      font-size: 16px;
      line-height: 1.5;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .btn:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="stats">
      <div class="stat-item">Modal: <span class="stat-val" id="modal-val">Rp 1.000.000</span></div>
      <div class="stat-item">Reputasi: <span class="stat-val" id="reputasi-val">50</span></div>
    </div>

    <div class="story-box">
      <div class="avatar">L</div>
      <div class="mentor-name">Lucas (Mentor Bisnis)</div>
      <div class="story-text" id="story-text">"Halo Richard! Selamat atas kelulusanmu. Modal awalmu Rp 1 Juta. Aksi apa yang ingin kamu ambil pertama kali?"</div>
    </div>

    <div class="options">
      <button class="btn" id="opt-a" onclick="makeChoice('A')">A. Sewa co-working space sebulan biar keren</button>
      <button class="btn" id="opt-b" onclick="makeChoice('B')">B. Beli alat desain & promosi online</button>
    </div>
  </div>

  <script>
    // 1. GANTI TULISAN DI BAWAH INI DENGAN API KEY GROQ ASLI KAMU (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)
    const GROQ_API_KEY = "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";

    let state = { modal: 1000000, reputasi: 50 };
    let currentOptions = {
      A: "Sewa co-working space sebulan biar keren",
      B: "Beli alat desain & promosi online"
    };

    const SYSTEM_PROMPT = `Kamu adalah game engine Visual Novel bisnis. 
Pemain adalah Richard (anak baru lulus SMA). Kamu adalah Lucas (Mentornya).
Respons WAJIB dalam format JSON murni tanpa markdown/backticks dengan skema ini:
{
  "dialog": "cerita/tanggapan lucas (maks 30 kata)",
  "modal_change": angka (misal -300000 atau 500000),
  "reputasi_change": angka (misal 10 atau -5),
  "option_a": "pilihan aksi A selanjutnya",
  "option_b": "pilihan aksi B selanjutnya"
}`;

    // Fungsi otomatis mencari nama model yang sedang aktif di akun Groq kamu
    async function getActiveModel() {
      try {
        const res = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` }
        });
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          // Cari model berjenis llama atau gemma yang aktif
          const selected = data.data.find(m => m.id.includes('llama') || m.id.includes('gemma'));
          return selected ? selected.id : data.data[0].id;
        }
      } catch (e) {
        console.error("Gagal mengambil model otomatis, menggunakan fallback.", e);
      }
      return "gemma2-9b-it";
    }

    async function makeChoice(choice) {
      const btnA = document.getElementById('opt-a');
      const btnB = document.getElementById('opt-b');
      btnA.disabled = true;
      btnB.disabled = true;

      const chosenText = currentOptions[choice];
      document.getElementById('story-text').innerText = "Lucas sedang berpikir...";
      
      const userPrompt = `Modal saat ini: ${state.modal}, Reputasi: ${state.reputasi}. Pemain memilih: "${chosenText}". Hasilkan kejadian berikutnya!`;

      try {
        // Ambil nama model aktif secara otomatis
        const currentModel = await getActiveModel();

        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: currentModel,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              { role: "user", content: userPrompt }
            ],
            response_format: { type: "json_object" },
            temperature: 0.7
          })
        });

        const data = await response.json();

        if (data.error) {
          alert("Error Groq: " + data.error.message);
          return;
        }

        const res = JSON.parse(data.choices[0].message.content);

        state.modal += res.modal_change;
        state.reputasi += res.reputasi_change;

        document.getElementById('modal-val').innerText = "Rp " + state.modal.toLocaleString('id-ID');
        document.getElementById('reputasi-val').innerText = state.reputasi;
        document.getElementById('story-text').innerText = `"${res.dialog}"`;
        document.getElementById('opt-a').innerText = "A. " + res.option_a;
        document.getElementById('opt-b').innerText = "B. " + res.option_b;

        currentOptions.A = res.option_a;
        currentOptions.B = res.option_b;

      } catch (err) {
        document.getElementById('story-text').innerText = "Koneksi terputus atau API Key salah. Coba klik lagi!";
        console.error(err);
      } finally {
        btnA.disabled = false;
        btnB.disabled = false;
      }
    }
  </script>
</body>
</html>
