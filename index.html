<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Business Simulator</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .game-container {
      background-color: #1e293b;
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      background-color: #0f172a;
      padding: 12px 20px;
      border-radius: 12px;
    }
    .stat-item {
      font-size: 14px;
      font-weight: bold;
    }
    .stat-val {
      color: #38bdf8;
    }
    .story-box {
      background-color: #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 50px;
      height: 50px;
      background-color: #6366f1;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .mentor-name {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .story-text {
      font-size: 16px;
      line-height: 1.5;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .btn:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="stats">
      <div class="stat-item">Modal: <span class="stat-val" id="modal-val">Rp 1.000.000</span></div>
      <div class="stat-item">Reputasi: <span class="stat-val" id="reputasi-val">50</span></div>
    </div>

    <div class="story-box">
      <div class="avatar">L</div>
      <div class="mentor-name">Lucas (Mentor Bisnis)</div>
      <div class="story-text" id="story-text">"Halo Richard! Selamat atas kelulusanmu. Modal awalmu Rp 1 Juta. Aksi apa yang ingin kamu ambil pertama kali?"</div>
    </div>

    <div class="options">
      <button class="btn" id="opt-a" onclick="makeChoice('A')">A. Sewa co-working space sebulan biar keren</button>
      <button class="btn" id="opt-b" onclick="makeChoice('B')">B. Beli alat desain & promosi online</button>
    </div>
  </div>

  <script>
    let state = { modal: 1000000, reputasi: 50, step: 1 };

    const scenarioTree = {
      1: {
        A: {
          dialog: "Gaya sih dapet, tapi modalmu tinggal Rp 200rb! Klien belum ada yang masuk. Mau ngapain sekarang?",
          modal_change: -800000, reputasi_change: 5,
          next_a: "Cari proyek freelance ketengan di internet",
          next_b: "Pinjam modal tambahan ke teman",
          step: 2
        },
        B: {
          dialog: "Pilihan bijak! Alat tempur lengkap dan iklan mulai berjalan. Ada 2 calon klien menghubungi!",
          modal_change: -300000, reputasi_change: 15,
          next_a: "Ambil proyek desain UMKM lokal (Rp 500rb)",
          next_b: "Tawar proyek branding perusahaan startup (Rp 2 Juta)",
          step: 3
        }
      },
      2: {
        A: {
          dialog: "Dapet orderan kecil Rp 300rb! Lumayan buat nambah nafas modal.",
          modal_change: 300000, reputasi_change: 10,
          next_a: "Fokus kumpulin portfolio", next_b: "Coba rekrut magang", step: 4
        },
        B: {
          dialog: "Temanmu mau minjemin Rp 1 Juta tapi minta bagi hasil 20%.",
          modal_change: 1000000, reputasi_change: -5,
          next_a: "Terima pinjaman", next_b: "Tolak dan kerja sendiri", step: 4
        }
      },
      3: {
        A: {
          dialog: "Klien UMKM puas banget! Kamu dapet testimoni bagus dan bayaran lancar.",
          modal_change: 500000, reputasi_change: 20,
          next_a: "Tingkatkan harga jasa", next_b: "Bikin paket langganan", step: 4
        },
        B: {
          dialog: "Startup-nya suka sama pitch kamu! Proyek besar resmi dimulai.",
          modal_change: 2000000, reputasi_change: 30,
          next_a: "Sewa tim tambahan", next_b: "Kerjakan sendiri sampai beres", step: 4
        }
      }
    };

    function makeChoice(choice) {
      const current = scenarioTree[state.step] ? scenarioTree[state.step][choice] : null;

      if (!current) {
        document.getElementById('story-text').innerText = `"Hebat Richard! Bisnismu terus berkembang stabil. Simulasi selesai untuk tahap ini!"`;
        document.getElementById('opt-a').style.display = 'none';
        document.getElementById('opt-b').style.display = 'none';
        return;
      }

      state.modal += current.modal_change;
      state.reputasi += current.reputasi_change;
      state.step = current.step;

      document.getElementById('modal-val').innerText = "Rp " + state.modal.toLocaleString('id-ID');
      document.getElementById('reputasi-val').innerText = state.reputasi;
      document.getElementById('story-text').innerText = `"${current.dialog}"`;
      document.getElementById('opt-a').innerText = "A. " + current.next_a;
      document.getElementById('opt-b').innerText = "B. " + current.next_b;
    }
  </script>
</body>
</html>
