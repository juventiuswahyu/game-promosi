<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Business Simulator</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .game-container {
      background-color: #1e293b;
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .api-config {
      background-color: #0f172a;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
    }
    .api-config input {
      flex: 1;
      background: #334155;
      border: 1px solid #475569;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .api-config button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      background-color: #0f172a;
      padding: 12px 20px;
      border-radius: 12px;
    }
    .stat-item {
      font-size: 14px;
      font-weight: bold;
    }
    .stat-val {
      color: #38bdf8;
    }
    .story-box {
      background-color: #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 50px;
      height: 50px;
      background-color: #6366f1;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .mentor-name {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .story-text {
      font-size: 16px;
      line-height: 1.5;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .btn:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="api-config">
      <input type="password" id="apiKeyInput" placeholder="Masukkan Groq API Key (gsk_...)" />
      <button onclick="saveApiKey()">Simpan Key</button>
    </div>

    <div class="stats">
      <div class="stat-item">Modal: <span class="stat-val" id="modal-val">Rp 1.000.000</span></div>
      <div class="stat-item">Reputasi: <span class="stat-val" id="reputasi-val">50</span></div>
    </div>

    <div class="story-box">
      <div class="avatar">L</div>
      <div class="mentor-name">Lucas (Mentor Bisnis)</div>
      <div class="story-text" id="story-text">"Halo Richard! Selamat atas kelulusanmu. Modal awalmu Rp 1 Juta. Aksi apa yang ingin kamu ambil pertama kali?"</div>
    </div>

    <div class="options">
      <button class="btn" id="opt-a" onclick="makeChoice('A')">A. Sewa co-working space sebulan biar keren</button>
      <button class="btn" id="opt-b" onclick="makeChoice('B')">B. Beli alat desain & promosi online</button>
    </div>
  </div>

  <script>
    let userApiKey = localStorage.getItem('GROQ_API_KEY') || "";
    if (userApiKey) {
      document.getElementById('apiKeyInput').value = userApiKey;
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) {
        alert("Masukkan API Key terlebih dahulu!");
        return;
      }
      localStorage.setItem('GROQ_API_KEY', key);
      userApiKey = key;
      alert("API Key berhasil disimpan!");
    }

    let state = { modal: 1000000, reputasi: 50 };
    let currentOptions = {
      A: "Sewa co-working space sebulan biar keren",
      B: "Beli alat desain & promosi online"
    };

    const SYSTEM_PROMPT = `Kamu adalah game engine Visual Novel bisnis. 
Pemain adalah Richard (anak baru lulus SMA). Kamu adalah Lucas (Mentornya).
Respons WAJIB HANYA berupa JSON valid tanpa teks lain, tanpa tanda markdown backticks (\`\`\`json).
Struktur JSON:
{
  "dialog": "cerita/tanggapan lucas (maks 30 kata)",
  "modal_change": angka,
  "reputasi_change": angka,
  "option_a": "pilihan aksi A selanjutnya",
  "option_b": "pilihan aksi B selanjutnya"
}`;

    // Daftar model alternatif jika salah satu tidak tersedia
    const MODELS_TO_TRY = [
      "llama-3.3-70b-versatile",
      "llama-3.1-8b-instant",
      "openai/gpt-oss-20b"
    ];

    async function makeChoice(choice) {
      if (!userApiKey) {
        alert("Silakan masukkan Groq API Key kamu di kolom atas terlebih dahulu!");
        return;
      }

      const btnA = document.getElementById('opt-a');
      const btnB = document.getElementById('opt-b');
      btnA.disabled = true;
      btnB.disabled = true;

      const chosenText = currentOptions[choice];
      document.getElementById('story-text').innerText = "Lucas sedang berpikir...";
      
      const userPrompt = `Modal saat ini: ${state.modal}, Reputasi: ${state.reputasi}. Pemain memilih: "${chosenText}". Hasilkan kejadian berikutnya dalam format JSON!`;

      let responseData = null;
      let success = false;

      // Coba satu per satu model yang tersedia
      for (const modelName of MODELS_TO_TRY) {
        try {
          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${userApiKey}`
            },
            body: JSON.stringify({
              model: modelName,
              messages: [
                { role: "system", content: SYSTEM_PROMPT },
                { role: "user", content: userPrompt }
              ],
              temperature: 0.7
            })
          });

          const data = await response.json();

          if (!data.error && data.choices && data.choices.length > 0) {
            responseData = data;
            success = true;
            break; // Berhasil, keluar dari loop
          }
        } catch (err) {
          console.warn(`Model ${modelName} gagal, mencoba model berikutnya...`);
        }
      }

      if (success && responseData) {
        try {
          let rawContent = responseData.choices[0].message.content.trim();
          rawContent = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
          
          const res = JSON.parse(rawContent);

          state.modal += res.modal_change;
          state.reputasi += res.reputasi_change;

          document.getElementById('modal-val').innerText = "Rp " + state.modal.toLocaleString('id-ID');
          document.getElementById('reputasi-val').innerText = state.reputasi;
          document.getElementById('story-text').innerText = `"${res.dialog}"`;
          document.getElementById('opt-a').innerText = "A. " + res.option_a;
          document.getElementById('opt-b').innerText = "B. " + res.option_b;

          currentOptions.A = res.option_a;
          currentOptions.B = res.option_b;
        } catch (parseErr) {
          document.getElementById('story-text').innerText = "Gagal memproses respon AI. Coba klik lagi!";
        }
      } else {
        alert("Gagal terhubung ke model AI. Pastikan API Key Groq kamu valid!");
        document.getElementById('story-text').innerText = "Koneksi terputus. Pastikan API Key benar!";
      }

      btnA.disabled = false;
      btnB.disabled = false;
    }
  </script>
</body>
</html>
