<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Business Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- BAR STATUS -->
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex justify-between items-center shadow-lg mt-2">
    <div>
      <p class="text-xs text-slate-400 font-bold tracking-wider">MODAL</p>
      <p id="modal-val" class="text-xl font-extrabold text-emerald-400">Rp 1.000.000</p>
    </div>
    <div class="text-right">
      <p class="text-xs text-slate-400 font-bold tracking-wider">REPUTASI</p>
      <p id="reputasi-val" class="text-xl font-extrabold text-amber-400">50</p>
    </div>
  </div>

  <!-- AREA DIALOG -->
  <div class="my-auto space-y-4">
    <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 text-center backdrop-blur">
      <div class="w-20 h-20 bg-indigo-600 rounded-full mx-auto mb-3 flex items-center justify-center font-bold text-2xl shadow-lg shadow-indigo-500/30">
        L
      </div>
      <h2 class="font-bold text-indigo-400 text-sm">LUCAS (MENTOR BISNIS)</h2>
      <p id="story-text" class="text-sm mt-2 text-slate-200 leading-relaxed">
        "Bro Richard, selamat lulus! Lu kan jago desain di HP, langkah awal apa nih buat dapet cuan?"
      </p>
    </div>
  </div>

  <!-- CONTAINER TOMBOL OPTION -->
  <div id="options-container" class="space-y-3 mb-4">
    <button onclick="makeChoice('A')" class="w-full bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 p-4 rounded-xl text-left text-sm font-semibold transition-all">
      <span class="text-indigo-400 mr-2">A.</span> <span id="opt-a">Sewa co-working space sebulan biar keren</span>
    </button>
    <button onclick="makeChoice('B')" class="w-full bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 p-4 rounded-xl text-left text-sm font-semibold transition-all">
      <span class="text-indigo-400 mr-2">B.</span> <span id="opt-b">Beli alat desain & promosi online</span>
    </button>
  </div>

  <script>
    // Ganti string di bawah dengan API Key Groq kamu
    const GROQ_API_KEY = "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"; 

    let state = { modal: 1000000, reputasi: 50 };
    let currentOptions = {
      A: "Sewa co-working space sebulan biar keren",
      B: "Beli alat desain & promosi online"
    };

    const SYSTEM_PROMPT = `Kamu adalah game engine Visual Novel bisnis. 
Pemain adalah Richard (anak baru lulus SMA). Kamu adalah Lucas (Mentornya).
Respons WAJIB dalam format JSON murni tanpa markdown/backticks dengan skema ini:
{
  "dialog": "cerita/tanggapan lucas (maks 30 kata)",
  "modal_change": angka (misal -300000 atau 500000),
  "reputasi_change": angka (misal 10 atau -5),
  "option_a": "pilihan aksi A selanjutnya",
  "option_b": "pilihan aksi B selanjutnya"
}`;

    async function makeChoice(choice) {
      const chosenText = currentOptions[choice];
      document.getElementById('story-text').innerText = "Lucas sedang berpikir...";
      
      const userPrompt = `Modal saat ini: ${state.modal}, Reputasi: ${state.reputasi}. Pemain memilih: "${chosenText}". Hasikan kejadian berikutnya!`;

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              { role: "user", content: userPrompt }
            ],
            response_format: { type: "json_object" },
            temperature: 0.7
          })
        });

        const data = await response.json();
        const res = JSON.parse(data.choices[0].message.content);

        // Update State
        state.modal += res.modal_change;
        state.reputasi += res.reputasi_change;

        // Update UI
        document.getElementById('modal-val').innerText = "Rp " + state.modal.toLocaleString('id-ID');
        document.getElementById('reputasi-val').innerText = state.reputasi;
        document.getElementById('story-text').innerText = `"${res.dialog}"`;
        document.getElementById('opt-a').innerText = res.option_a;
        document.getElementById('opt-b').innerText = res.option_b;

        currentOptions.A = res.option_a;
        currentOptions.B = res.option_b;

      } catch (err) {
        document.getElementById('story-text').innerText = "Gagal terhubung ke Groq. Periksa API Key kamu!";
        console.error(err);
      }
    }
  </script>
</body>
</html>
